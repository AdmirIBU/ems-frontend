server {
  listen       80;
  server_name  localhost;
  root /usr/share/nginx/html;

  # Proxy API requests to backend service (internal Docker hostname)
  location /api/ {
    # Nginx resolves upstream hostnames once at startup unless a variable is used.
    # Use Docker's embedded DNS resolver so backend restarts (IP changes) don't cause 502s.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $backend_upstream http://backend:5000;
    proxy_pass $backend_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Optional: serve compressed assets if present
  gzip on;
  gzip_types text/plain application/javascript application/json text/css application/xml;
}
